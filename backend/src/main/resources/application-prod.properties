# ============================================================
# PRODUCTION CONFIGURATION
# ============================================================

server.port=8080

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/smart_healthcare?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update   # Agar pehle se table hai toh 'none' karo
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== JWT SECRET =====
jwt.secret=MySuperSecretKeyForJWT2026WithMoreThan32Characters

# ===== EMAIL (OTP KE LIYE) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ID@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

# ===== CORS (FRONTEND URL) =====
cors.allowed.origins=http://localhost:5173

# ===== LOGGING =====
logging.level.com.healthcare.backend=ERROR
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR